<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Password - Shaxsiy Kabinet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #333;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .auth-card, .popup-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .auth-card h2, .popup-card h3 {
            margin-bottom: 20px;
            color: #1e293b;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #475569;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            color: #1e293b;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #4338ca;
        }

        .switch-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
        }

        .switch-auth span {
            color: #4f46e5;
            font-weight: 600;
        }

        /* Asosiy Dashboard (Moslashuvchan) */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 1100px;
            height: 88vh;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            grid-template-columns: 260px 1fr;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .user-profile-badge {
            background: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            word-break: break-all;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            min-width: 32px;
            background: #4f46e5;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-links li a {
            display: block;
            padding: 10px 14px;
            color: #334155;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.2s;
            font-size: 14px;
        }

        .nav-links li.active a, .nav-links li a:hover {
            background: rgba(255, 255, 255, 0.6);
            color: #1e293b;
            font-weight: 500;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            color: #dc2626;
            font-weight: 600;
            text-align: center;
            transition: background 0.2s;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .main-content {
            padding: 25px;
            overflow-y: auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-bar h1 {
            font-size: 20px;
            color: #1e293b;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .search-bar {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .password-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }

        .card-info {
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 6px 4px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            cursor: pointer;
            color: #334155;
            transition: background 0.2s;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .action-btn.delete {
            color: #dc2626;
        }

        .hidden {
            display: none !important;
        }

        /* MOBIL TELEFONLAR UCHUN MAXSUS MOSLASHUV (Responsive) */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .dashboard {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 95vh;
                border-radius: 20px;
            }

            .sidebar {
                flex-direction: row;
                align-items: center;
                padding: 12px 15px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.4);
                gap: 10px;
            }

            .logo-area, .user-profile-badge, .nav-links {
                display: none; /* Telefonda ortiqcha joy olmasligi uchun menyu qismlarini yig'amiz */
            }

            .sidebar .logout-btn {
                width: auto;
                padding: 6px 12px;
                font-size: 12px;
                margin: 0;
            }

            /* Mobil versiyada yuqori qismga mini-profil qo'shamiz */
            .mobile-top-user {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #1e293b;
                font-weight: 600;
                word-break: break-all;
            }

            .main-content {
                padding: 15px;
            }

            .header-bar h1 {
                font-size: 18px;
            }
        }

        /* Kompyuterda mobil elementni ko'rsatmaslik */
        .mobile-top-user {
            display: none;
        }
        @media (max-width: 768px) {
            .mobile-top-user {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- 1. KIRISH / RO'YXATDAN O'TISH OYNASI -->
    <div id="authModal" class="modal-overlay">
        <div class="auth-card">
            <h2 id="authTitle">🔒 Gmail bilan Kirish</h2>
            
            <div class="form-group">
                <label>Gmail manzili:</label>
                <input type="email" id="authEmail" placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label>Parol:</label>
                <input type="password" id="authPassword" placeholder="Maxfiy parolingiz">
            </div>

            <button class="btn" id="authBtn" onclick="handleAuth()">Kirish</button>
            
            <div class="switch-auth" id="switchText" onclick="toggleAuthMode()">
                Akkauntingiz yo'qmi? <span>Ro'yxatdan o'tish</span>
            </div>
        </div>
    </div>

    <!-- 2. YANGI PAROL QO'SHISH MODALI -->
    <div id="addModal" class="modal-overlay hidden">
        <div class="popup-card">
            <h3>Yangi Parol Qo'shish</h3>
            <div class="form-group">
                <label>Ilova nomi (Sayt):</label>
                <input type="text" id="appName" placeholder="Masalan: Telegram">
            </div>
            <div class="form-group">
                <label>Login / Email / Username:</label>
                <input type="text" id="appLogin" placeholder="Login yoki telefon raqam">
            </div>
            <div class="form-group">
                <label>Parol:</label>
                <input type="text" id="appPassword" placeholder="Maxfiy parol">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="savePassword()">Saqlash</button>
                <button class="btn" style="background: #94a3b8;" onclick="closeAddModal()">Bekor qilish</button>
            </div>
        </div>
    </div>

    <!-- 3. ASOSIY DASHBOARD (SHAXSIY KABINET) -->
    <div id="dashboard" class="dashboard">
        <div class="sidebar">
            <div>
                <div class="logo-area">
                    <span>🛡️ SAVE PASSWORD</span>
                </div>
                <div class="user-profile-badge">
                    <div class="avatar-circle" id="userAvatar">G</div>
                    <span id="displayUserEmail" style="font-size: 13px; font-weight: 500;">email@gmail.com</span>
                </div>
                <ul class="nav-links">
                    <li class="active"><a href="#">Barcha parollar</a></li>
                    <li><a href="#" onclick="openAddModal()">+ Yangi qo'shish</a></li>
                    <li><a href="#">Xavfsizlik</a></li>
                    <li><a href="#">Sozlamalar</a></li>
                </ul>
            </div>
            
            <!-- Mobil uchun qisqa profil qismi -->
            <div class="mobile-top-user">
                <div class="avatar-circle" id="mobileAvatar" style="width: 28px; height: 28px; min-width: 28px; font-size: 12px;">G</div>
                <span id="mobileDisplayEmail">email...</span>
            </div>

            <div class="logout-btn" onclick="logoutUser()">Chiqish</div>
        </div>

        <div class="main-content">
            <div class="header-bar">
                <h1>Xush kelibsiz!</h1>
                <button class="add-btn" onclick="openAddModal()">+ Yangi Parol Qo'shish</button>
            </div>

            <input type="text" class="search-bar" id="searchInput" placeholder="Ilovani qidirish..." onkeyup="filterPasswords()">

            <div class="cards-grid" id="passwordsGrid">
                <!-- Parollar kartochkalari -->
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentEmail = localStorage.getItem('sp_current_user');

        window.onload = function() {
            if (currentEmail) {
                showDashboard();
            }
        };

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            let title = document.getElementById('authTitle');
            let btn = document.getElementById('authBtn');
            let switchText = document.getElementById('switchText');

            if (isRegisterMode) {
                title.innerText = "📝 Ro'yxatdan o'tish";
                btn.innerText = "Ro'yxatdan o'tish";
                switchText.innerHTML = "Akkauntingiz bormi? <span>Kirish</span>";
            } else {
                title.innerText = "🔒 Gmail bilan Kirish";
                btn.innerText = "Kirish";
                switchText.innerHTML = "Akkauntingiz yo'qmi? <span>Ro'yxatdan o'tish</span>";
            }
        }

        function handleAuth() {
            let email = document.getElementById('authEmail').value.trim().toLowerCase();
            let pass = document.getElementById('authPassword').value.trim();

            if (!email || !pass) {
                alert('Iltimos, Gmail va parolni kiriting!');
                return;
            }

            if (!email.endsWith('@gmail.com')) {
                alert('Iltimos, haqiqiy Gmail manzilini kiriting (@gmail.com)!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('sp_users')) || {};

            if (isRegisterMode) {
                if (users[email]) {
                    alert('Bu Gmail allaqachon ro\'yxatdan o\'tgan! Iltimos, kiring.');
                    return;
                }
                users[email] = { password: pass };
                localStorage.setItem('sp_users', JSON.stringify(users));
                alert('Muvaffaqiyatli ro\'yxatdan o\'tdingiz!');
            } else {
                if (!users[email] || users[email].password !== pass) {
                    alert('Gmail yoki parol xato!');
                    return;
                }
            }

            currentEmail = email;
            localStorage.setItem('sp_current_user', currentEmail);
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('dashboard').style.display = 'grid';
            
            document.getElementById('displayUserEmail').innerText = currentEmail;
            document.getElementById('userAvatar').innerText = currentEmail.charAt(0).toUpperCase();

            document.getElementById('mobileDisplayEmail').innerText = currentEmail;
            document.getElementById('mobileAvatar').innerText = currentEmail.charAt(0).toUpperCase();
            
            renderPasswords();
        }

        function logoutUser() {
            localStorage.removeItem('sp_current_user');
            location.reload();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('appName').value = '';
            document.getElementById('appLogin').value = '';
            document.getElementById('appPassword').value = '';
        }

        function getUserPasswordsKey() {
            return 'sp_passwords_' + currentEmail;
        }

        function savePassword() {
            let name = document.getElementById('appName').value.trim();
            let login = document.getElementById('appLogin').value.trim();
            let pass = document.getElementById('appPassword').value.trim();

            if (!name || !login || !pass) {
                alert('Barcha maydonlarni to\'ldiring!');
                return;
            }

            let userKey = getUserPasswordsKey();
            let passwords = JSON.parse(localStorage.getItem(userKey)) || [];

            let newObj = {
                id: Date.now(),
                name: name,
                login: login,
                pass: pass,
                show: false
            };

            passwords.push(newObj);
            localStorage.setItem(userKey, JSON.stringify(passwords));
            
            closeAddModal();
            renderPasswords();
        }

        function renderPasswords(filterText = '') {
            let userKey = getUserPasswordsKey();
            let passwords = JSON.parse(localStorage.getItem(userKey)) || [];
            let grid = document.getElementById('passwordsGrid');
            grid.innerHTML = '';

            let filtered = passwords.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()) || p.login.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: #475569; grid-column: 1/-1; font-size: 14px;">Hozircha saqlangan parollar yo'q.</p>`;
                return;
            }

            filtered.forEach(item => {
                let displayPass = item.show ? item.pass : '••••••••';
                let card = document.createElement('div');
                card.className = 'password-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.name}</span>
                    </div>
                    <div class="card-info">Login: ${item.login}</div>
                    <div class="card-info">Parol: <b>${displayPass}</b></div>
                    <div class="card-actions">
                        <button class="action-btn" onclick="togglePass(${item.id})">${item.show ? 'Yashirish' : 'Ko\'rish'}</button>
                        <button class="action-btn" onclick="copyPass('${item.pass}')">Nusxalash</button>
                        <button class="action-btn delete" onclick="deletePass(${item.id})">O'chirish</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function togglePass(id) {
            let userKey = getUserPasswordsKey();
            let passwords = JSON.parse(localStorage.getItem(userKey)) || [];
            passwords = passwords.map(p => {
                if (p.id === id) p.show = !p.show;
                return p;
            });
            localStorage.setItem(userKey, JSON.stringify(passwords));
            renderPasswords(document.getElementById('searchInput').value);
        }

        function copyPass(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Parol nusxalandi!');
            });
        }

        function deletePass(id) {
            if (confirm('Rostdan ham bu parolni o\'chirmoqchimisiz?')) {
                let userKey = getUserPasswordsKey();
                let passwords = JSON.parse(localStorage.getItem(userKey)) || [];
                passwords = passwords.filter(p => p.id !== id);
                localStorage.setItem(userKey, JSON.stringify(passwords));
                renderPasswords(document.getElementById('searchInput').value);
            }
        }

        function filterPasswords() {
            let query = document.getElementById('searchInput').value;
            renderPasswords(query);
        }
    </script>
</body>
</html>
